<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BiliSR</title><style>body{max-width:680px;margin:64px auto;padding:0 24px;font:17px/1.8 system-ui;color:#243047;background:#f6f8fb}a{color:#165dcc}code{overflow-wrap:anywhere}</style><h1>BiliSR</h1><p>一个 Shadowrocket 模块，处理哔哩哔哩开屏、暂停、首页与视频页广告。</p><p><a href="BiliSR.srmodule">下载 BiliSR v0.3.0</a></p><p>在 Shadowrocket → 配置 → 模块 → + 中粘贴：</p><p><code>https://bili-sr.yuzhes.com/BiliSR.srmodule</code></p><p>请先关闭旧 BiliSR 拆分模块及处理相同接口的其他模块，保持 HTTPS 解密、证书信任和 HTTP/2 MITM 开启。</p><p>旧开屏素材可能保留在应用数据中。模块不能直接删除这些文件，普通清缓存也未必有效。不要为常规安装随意删除应用。</p><p><a href="https://github.com/bkmashiro/BiliSR">源码、安装说明与问题反馈</a> · <a href="https://github.com/bkmashiro/BiliSR/releases">历史版本</a> · <a href="SHA256SUMS">文件校验</a></p></html>
